name: 測速照相資料更新
on:
  workflow_dispatch:
  schedule:
    - cron: "17 19 * * *"   # 每天台灣時間 03:17
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/speedcam_build.py
      - name: 有變動才提交
        run: |
          git config user.name "speedcam-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: 測速照相點更新 $(date -u +%F)"
          git push
